{{define "content"}}
<section class="panel"><div class="panel-heading"><div><p class="eyebrow">AUDIT TRAIL</p><h2>最近300条操作记录</h2></div><span class="pill private">不可由普通用户修改</span></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th><th>说明</th><th>IP</th></tr></thead><tbody>{{range .Data}}<tr><td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td><td><strong>{{.ActorName}}</strong></td><td><code>{{.Action}}</code></td><td>{{.Entity}}</td><td>{{.Detail}}</td><td>{{.IPAddress}}</td></tr>{{else}}<tr><td colspan="6" class="empty">暂无操作记录</td></tr>{{end}}</tbody></table></div></section>
{{end}}
