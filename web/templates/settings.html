{{define "content"}}
<section class="split-grid settings-grid">
  <form action="/admin/settings" method="post" class="panel"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="panel-heading"><div><p class="eyebrow">LOAD RULES</p><h2>负荷与报警规则</h2></div></div><div class="form-grid two"><label>标准日工时<input type="number" name="workday_hours" min="1" max="12" step="0.5" value="{{.Data.WorkdayHours}}"></label><label>连续报警周数 X<input type="number" name="alert_weeks" min="1" max="12" value="{{.Data.AlertWeeks}}"></label><label>每周报警工时 Y<input type="number" name="alert_hours" min="1" max="168" step="0.5" value="{{.Data.AlertHours}}"></label></div><h3>负荷分级阈值</h3><div class="threshold-grid"><label>空闲上限<input name="threshold_idle" type="number" value="{{index .Data.Thresholds 0}}"><small>%</small></label><label>较闲上限<input name="threshold_light" type="number" value="{{index .Data.Thresholds 1}}"><small>%</small></label><label>正常上限<input name="threshold_normal" type="number" value="{{index .Data.Thresholds 2}}"><small>%</small></label><label>较忙上限<input name="threshold_busy" type="number" value="{{index .Data.Thresholds 3}}"><small>%</small></label></div><hr class="settings-divider"><div class="panel-heading compact-heading"><div><p class="eyebrow">REPORT WINDOW</p><h3>有效填报时间窗口</h3><p class="muted">当前：{{.Data.ReportWindow}}。普通员工和专业负责人只能在此窗口内保存或修改；系统管理员与测试账号仍可随时测试。</p></div></div><div class="report-window-grid"><label>开始星期<select name="report_open_weekday"><option value="1" {{if eq .Data.ReportOpenWeekday "1"}}selected{{end}}>周一</option><option value="2" {{if eq .Data.ReportOpenWeekday "2"}}selected{{end}}>周二</option><option value="3" {{if eq .Data.ReportOpenWeekday "3"}}selected{{end}}>周三</option><option value="4" {{if eq .Data.ReportOpenWeekday "4"}}selected{{end}}>周四</option><option value="5" {{if eq .Data.ReportOpenWeekday "5"}}selected{{end}}>周五</option><option value="6" {{if eq .Data.ReportOpenWeekday "6"}}selected{{end}}>周六</option><option value="0" {{if eq .Data.ReportOpenWeekday "0"}}selected{{end}}>周日</option></select></label><label>开始时间<input type="time" name="report_open_time" required value="{{.Data.ReportOpenTime}}"></label><label>截止星期<select name="report_close_weekday"><option value="1" {{if eq .Data.ReportCloseWeekday "1"}}selected{{end}}>周一</option><option value="2" {{if eq .Data.ReportCloseWeekday "2"}}selected{{end}}>周二</option><option value="3" {{if eq .Data.ReportCloseWeekday "3"}}selected{{end}}>周三</option><option value="4" {{if eq .Data.ReportCloseWeekday "4"}}selected{{end}}>周四</option><option value="5" {{if eq .Data.ReportCloseWeekday "5"}}selected{{end}}>周五</option><option value="6" {{if eq .Data.ReportCloseWeekday "6"}}selected{{end}}>周六</option><option value="0" {{if eq .Data.ReportCloseWeekday "0"}}selected{{end}}>周日</option></select></label><label>截止时间<input type="time" name="report_close_time" required value="{{.Data.ReportCloseTime}}"></label></div><button class="button primary" type="submit">保存规则与填报窗口</button></form>
  <article class="panel"><div class="panel-heading"><div><p class="eyebrow">WORK CALENDAR</p><h2>节假日与调休</h2></div></div><form action="/admin/calendar" method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label>日期<input type="date" name="work_date" required></label><label>当天可用工时<input type="number" name="work_hours" min="0" max="24" step="0.5" required value="0"></label><label>说明<input name="label" required placeholder="例如：国庆节 / 调休工作日"></label><button class="button secondary" type="submit">添加或更新日期</button></form><div class="calendar-list">{{range .Data.Calendar}}<div><time>{{.Date}}</time><strong>{{hours .Hours}}h</strong><span>{{.Label}}</span></div>{{else}}<p class="empty">暂无特殊工作日记录</p>{{end}}</div></article>
</section>
{{end}}
