{{define "content"}}
<div class="back-row"><a class="text-link" href="/admin/users">← 返回员工名单</a></div>
<form action="/admin/users/{{.Data.User.ID}}/permissions" method="post" class="panel"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="panel-heading"><div><p class="eyebrow">PERMISSION OVERRIDES</p><h2>{{.Data.User.Name}}的个人权限</h2><p class="muted">默认继承“{{.Data.User.RoleName}}”权限；个人设置会覆盖角色默认值。</p></div><button class="button primary" type="submit">保存权限</button></div><div class="permission-list">{{range .Data.Permissions}}<label class="permission-row"><span><strong>{{.Name}}</strong><small>{{.Category}} · {{.Code}}</small></span><select name="perm_{{.Code}}"><option value="default" {{if eq .Mode "default"}}selected{{end}}>跟随角色默认（{{if .RoleAllowed}}允许{{else}}禁止{{end}}）</option><option value="allow" {{if eq .Mode "allow"}}selected{{end}}>单独允许</option><option value="deny" {{if eq .Mode "deny"}}selected{{end}}>单独禁止</option></select></label>{{end}}</div></form>
{{end}}
