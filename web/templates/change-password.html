{{define "content"}}
<section class="narrow-panel panel">
  <div class="panel-heading"><div><p class="eyebrow">ACCOUNT SECURITY</p><h2>{{if .CurrentUser.MustChangePassword}}首次登录，请设置新密码{{else}}修改登录密码{{end}}</h2></div></div>
  <p class="muted">新密码至少6个字符。首次登录必须修改初始密码；修改后，其他设备上的登录会失效。</p>
  <form action="/change-password" method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>当前密码<input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>新密码<input type="password" name="new_password" required autocomplete="new-password" minlength="6"></label>
    <label>确认新密码<input type="password" name="confirm_password" required autocomplete="new-password" minlength="6"></label>
    <button class="button primary" type="submit">保存新密码</button>
  </form>
</section>
{{end}}
