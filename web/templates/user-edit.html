{{define "content"}}
<div class="back-row"><a class="text-link" href="/admin/users">← 返回员工名单</a></div><form action="/admin/users/{{.Data.ID}}/edit" method="post" class="panel narrow-panel"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="panel-heading"><div><p class="eyebrow">ACCOUNT PROFILE</p><h2>{{.Data.Name}}</h2><p class="muted">{{.Data.Email}}</p></div></div><div class="stack-form"><label>姓名<input name="name" value="{{.Data.Name}}" required></label><label>公司邮箱<input type="email" name="email" value="{{.Data.Email}}" required></label><label>移动电话<input name="mobile" inputmode="tel" value="{{.Data.Mobile}}"></label><label>执业资格<input name="qualification" value="{{.Data.Qualification}}"></label><label>职称<input name="professional_title" value="{{.Data.ProfessionalTitle}}"></label><label>员工层级<select name="role"><option value="designer" {{if eq .Data.Role "designer"}}selected{{end}}>设计师</option><option value="lead" {{if eq .Data.Role "lead"}}selected{{end}}>专业负责人</option><option value="manager" {{if eq .Data.Role "manager"}}selected{{end}}>部门领导</option></select></label><label class="check-line"><input type="checkbox" name="active" value="1" {{if .Data.Active}}checked{{end}}>启用此账号</label><label class="check-line"><input type="checkbox" name="is_system_admin" value="1" {{if .Data.IsSystemAdmin}}checked{{end}}>指定为系统管理员</label><label class="check-line"><input type="checkbox" name="is_test_user" value="1" {{if .Data.IsTestUser}}checked{{end}}>测试用户（数据不进入部门统计，免首次强制改密）</label><p class="muted">测试用户不能同时设为系统管理员。取消测试身份后，下次登录将强制修改密码；停用账号会立即清除全部登录会话。</p><button class="button primary" type="submit">保存账号设置</button></div></form>
{{end}}
